<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Explorer · Ludiworld</title>
  <meta name="description" content="L'arbre des compétences de Ludiworld : les maths, les sciences, le monde, les autres… et les jeux qui les font travailler.">
  <meta name="theme-color" content="#16204a">
  <link rel="icon" href="../icons/marmotte-192.png">
  <link rel="apple-touch-icon" href="../icons/marmotte-180.png">
  <link rel="preload" href="../fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/lexend.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../site/barre.css">
  <link rel="stylesheet" href="../site/site.css">
  <link rel="stylesheet" href="explorer.css">
</head>
<body data-page="explorer" class="page-explorer">
  <a class="skip" href="#contenu" data-t="skip">Aller au contenu</a>
  <div id="lw-barre"></div>

  <main id="contenu" class="ex">
    <div class="ex-outils">
      <h1 class="ex-titre" id="ex-titre" data-t="h1">Explorer</h1>
      <div class="ex-cherche" role="search">
        <label class="ex-cache" for="ex-q" id="ex-q-label" data-t="chercher">Chercher un sujet ou un jeu</label>
        <input id="ex-q" type="search" autocomplete="off">
        <div class="ex-resultats" id="ex-resultats" hidden></div>
      </div>
      <div class="ex-enfants" id="ex-enfants"></div>
    </div>
    <nav class="ex-branches" id="ex-branches" data-t-aria="branches" aria-label="Les branches"></nav>
    <div class="ex-scene">
      <section class="ex-arbre" id="ex-arbre" aria-live="off"><p class="ex-attente" data-t="loading">L'arbre pousse…</p></section>
      <aside class="ex-panneau" id="ex-panneau" aria-live="polite"></aside>
    </div>
  </main>

  <footer class="foot" id="lw-pied"></footer>

  <script src="../site/barre.js" defer></script>
  <script src="../site/site.js" defer></script>
  <script src="en.js" defer></script>
  <script src="../site/arbre.js" defer></script>
  <script src="explorer.js" defer></script>
</body>
</html>
