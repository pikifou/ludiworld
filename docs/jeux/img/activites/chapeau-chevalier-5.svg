  <line x1="75" y1="185" x2="225" y2="185" stroke="#4c5b7c" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M246 222 Q 272 185 246 152" fill="none" stroke="#e0a400" stroke-width="7" stroke-linecap="round" marker-end="url(#f)"/>
</svg>
